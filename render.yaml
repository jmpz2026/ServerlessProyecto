services:
  - type: web
    name: serverless-proyecto-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: WORKER_URL
        sync: false
      - key: CORS_ORIGENES
        sync: false

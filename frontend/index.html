<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Envio de correo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <section class="tarjeta">
      <div class="marca" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
          <path d="m4 7 8 6 8-6"></path>
        </svg>
      </div>

      <h1>Enviar correo</h1>
      <p class="subtitulo">Escribe el destinatario, el asunto y el mensaje, y lo enviamos al instante.</p>

      <form id="formulario" novalidate>
        <div class="campo">
          <label for="correo">Correo destino</label>
          <input type="email" id="correo" name="correo" placeholder="nombre@ejemplo.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" name="asunto" placeholder="Hola desde el proyecto" maxlength="150" required>
        </div>

        <div class="campo">
          <div class="campo-cabecera">
            <label for="cuerpo">Mensaje</label>
            <span id="contador" class="contador" aria-hidden="true">0 / 5000</span>
          </div>
          <textarea id="cuerpo" name="mensaje" rows="6" placeholder="Escribe tu mensaje..." maxlength="5000" required></textarea>
        </div>

        <button type="submit" id="boton">
          <span class="spinner" aria-hidden="true"></span>
          <span class="boton-texto">Enviar</span>
        </button>
      </form>

      <div id="mensaje" class="alerta" role="status" aria-live="polite" hidden>
        <svg class="icono icono-exito" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="m8 12.5 2.5 2.5L16 9.5"></path>
        </svg>
        <svg class="icono icono-error" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="m9 9 6 6M15 9l-6 6"></path>
        </svg>
        <span id="mensaje-texto"></span>
      </div>
    </section>

    <footer class="pie">Netlify &rarr; Spring Boot &rarr; Cloudflare Worker &rarr; SendGrid</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

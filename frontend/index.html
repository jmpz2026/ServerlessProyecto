<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envio de correo</title>
</head>
<body>
  <main>
    <h1>Enviar correo</h1>
    <form id="formulario">

      <input type="email" id="correo" name="correo" required>
      <button type="submit">Enviar</button>
    </form>
    <p id="mensaje"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
